plugins {
    id 'com.android.application'
}
android {
    namespace 'com.fosch.securitylab'
    compileSdk 36
    defaultConfig {
        applicationId 'com.fosch.securitylab'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '0.5.0'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
