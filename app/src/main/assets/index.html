else if(page==="legal"){a.innerHTML=`<button class="back" type="button" onclick="goBack()">‹ About FOSCH</button><h1>Legal</h1><p class="muted">Important information about FOSCH, its sources and its limitations.</p><section class="panel legal-copy"><h2>Health and food-safety disclaimer</h2><p>FOSCH is provided for general educational and informational purposes only. It is not medical advice, diagnosis, treatment, a clinical assessment, a personalised dietary recommendation or emergency guidance. Do not use FOSCH to diagnose an allergy, decide whether a symptom is caused by an ingredient, or determine whether a food is safe for a particular person.</p><p>Food sensitivities, allergies, medical conditions, exposure and individual risk vary. For personal advice, consult a qualified health professional in your country or local area, such as a doctor, pharmacist, registered dietitian or allergy specialist. For a suspected severe reaction, poisoning or other emergency, contact your local emergency service or poison information centre immediately.</p><h2>Accuracy and regulatory information</h2><p>FOSCH makes reasonable efforts to present source-linked information, but entries may be incomplete, simplified, inaccurate or out of date. An E-number, additive name, database record or research reference does not by itself establish that a substance is approved, safe or appropriate for every food, amount, person or country.</p><p>Food-additive permissions, maximum levels, food categories, warnings and labelling rules differ between jurisdictions and can change. Always check the complete product label and current requirements from the competent food-safety authority in your country. Do not rely on FOSCH as the sole basis for a purchase, dietary, health or compliance decision.</p><h2>Products, companies and trademarks</h2><p>Product names, brand names, company names, trademarks, logos, packaging designs, photographs and other third-party intellectual property displayed or referred to in FOSCH belong to their respective owners. FOSCH does not own, operate, represent, sponsor or endorse those brands or manufacturers. Their appearance is for identification and informational purposes only and does not imply an affiliation, partnership, approval or endorsement.</p><p>FOSCH does not claim ownership of third-party product information or brand assets. Where third-party material is shown, its original owner and applicable licence or terms continue to apply.</p><h2>Copyright and FOSCH project identity</h2><p>© 2026 SF12. The original FOSCH source code is made available under the MIT License, as set out in the project’s <b>LICENSE</b> file. That software licence does not automatically cover third-party datasets, article text, product content, photographs, trademarks, or other separately licensed material.</p><p>The FOSCH / Food Safety Check project name, logo and original project branding are not granted for reuse by the MIT software licence. No statement here claims that the name or logo is a registered trademark. Permission to use project branding must be obtained separately.</p><h2>Third-party data and attribution</h2><p>Wikipedia article previews are sourced from the relevant article and link back to it. Most English Wikipedia text is generally available under the <a class="legal-link" href="https://creativecommons.org/licenses/by-sa/4.0/" onclick="return openReferenceUrl('https://creativecommons.org/licenses/by-sa/4.0/',this)">Creative Commons Attribution-ShareAlike 4.0 licence (CC BY-SA 4.0)</a>, subject to the licence shown for the individual page or content. Wikipedia and the Wikimedia Foundation are independent of FOSCH; FOSCH is not endorsed by them.</p><p>Some product lookup information is retrieved from Open Food Facts, an independent community project. Its database is made available under the <a class="legal-link" href="https://opendatacommons.org/licenses/odbl/1-0/" onclick="return openReferenceUrl('https://opendatacommons.org/licenses/odbl else if(page==="terms"){a.innerHTML=`<button class="back" type="button" onclick="goBack()">‹ Legal</button><h1>Terms and Conditions</h1><p class="muted">Terms for using the Food Safety Check prototype.</p><section class="panel legal-copy"><h2>1. Acceptance</h2><p>By installing or using FOSCH, you agree to these Terms and Conditions. If you do not agree, stop using the app.</p><h2>2. Permitted use</h2><p>You may use FOSCH for lawful personal, educational and research purposes. You must not misuse the app, interfere with its operation, attempt unauthorised access to systems, or present FOSCH output as an official regulatory decision or professional assessment.</p><h2>3. No professional advice</h2><p>FOSCH is an informational reference tool only. It does not replace medical, dietetic, allergy, toxicology, laboratory, legal or regulatory advice. You are responsible for checking the package label and relevant official sources and for seeking qualified local advice when appropriate.</p><h2>4. Product and source information</h2><p>Third-party records and user-contributed information may be incomplete, incorrect, duplicated or outdated. Product formulations and labelling can differ by country, package size and date. The physical product packaging and current official requirements should be checked before relying on a record.</p><h2>5. Contributions and conduct</h2><p>You are responsible for any text or photos you create or save in FOSCH. Do not knowingly provide false, misleading, unlawful, private or rights-infringing material. Only submit content and images that you are entitled to use. In this prototype, contributions are stored locally on your device and are not sent to an FOSCH server or reviewed by an FOSCH administrator.</p><h2>6. Third-party services and intellectual property</h2><p>Some features rely on third-party services, including Wikipedia and Open Food Facts. Their services, content, trademarks and licences remain governed by their own terms. FOSCH does not c let wikipediaArticleUrl="",wikipediaPageTitle="",wikipediaSectionTitle="";
function wikiNormaliseName(value){return String(value||"").toLowerCase().normalize("NFKD").replace(/[’'`]/g,"").replace(/[^a-z0-9]+/g," ").trim().replace(/\s+/g," ").replace(/\bsulphur\b/g,"sulfur").replace(/\bsulphite\b/g,"sulfite").replace(/\bsulphates?\b/g,"sulfate").replace(/\baluminium\b/g,"aluminum").replace(/\bcolour\b/g,"color")}
function wikipediaSearchNames(entry){const x=entry&&typeof entry==="object"?entry:{name:String(entry||"")};const values=[x.name,x.chemicalName,x.wikiTitle,...(Array.isArray(x.synonyms)?x.synonyms:[]),...(Array.isArray(x.commonNames)?x.commonNames:[])];if(x.wikiUrl){try{const slug=x.wikiUrl.split("/wiki/")[1];if(slug)values.push(decodeURIComponent(slug).replace(/_/g," ").replace(/\s*\([^)]*\)$/, ""))}catch(e){}}const out=[];for(const value of values){const base=String(value||"").trim();if(!base)continue;out.push(base,base.replace(/sulphur/ig,"sulfur").replace(/sulphite/ig,"sulfite").replace(/sulphate/ig,"sulfate").replace(/aluminium/ig,"aluminum"),base.replace(/\([^)]*\)/g," ").replace(/\s+/g," ").trim())}return [...new Set(out.filter(Boolean))]}
function wikiCacheRead(code){try{const all=JSON.parse(localStorage.getItem("fosch-wikipedia-preview-cache")||"{}");const item=all[String(code||"").toUpperCase()];if(item&&item.version===2&&item.expires>Date.now())return item}catch(e){}return null}
function wikiCacheWrite(code,value){try{const all=JSON.parse(localStorage.getItem("fosch-wikipedia-preview-cache")||"{}");all[String(code||"").toUpperCase()]={...value,version:2,expires:Date.now()+30*24*60*60*1000};localStorage.setItem("fosch-wikipedia-preview-cache",JSON.stringify(all))}catch(e){}}
async function wikiFetchJson(url){const response=await fetch(url,{headers:{accept:"application/json"}});if(!response.ok)throw new Error("Wikipedia request failed: "+response.status);return response.json()}
function wikipediaArticleFromUrl(url){const value=String(url||"");const match=value.match(/\/wiki\/([^?#]+)/i);if(!match)return null;try{const title=decodeURIComponent(match[1]).replace(/_/g," ");return title?{title,url:value}:null}catch(e){return null}}
async function searchWikipediaByCode(x){const code=String(x&&x.code||"").trim().toUpperCase();if(!code)return null;const codeNorm=wikiNormaliseName(code);const chemicalNames=wikipediaSearchNames({...x,wikiUrl:""}).map(wikiNormaliseName).filter(Boolean);for(const query of ['"'+code+'"',code]){try{const url="https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch="+encodeURIComponent(query)+"&srnamespace=0&srlimit=8&format=json&origin=*";const data=await wikiFetchJson(url);const hits=data&&data.query&&data.query.search||[];const ranked=hits.map((h,i)=>{const title=String(h.title||"");const titleNorm=wikiNormaliseName(title);const snippetNorm=wikiNormaliseName(String(h.snippet||"").replace(/<[^>]*>/g," "));const titleHasCode=titleNorm===codeNorm||titleNorm.startsWith(codeNorm+" ");const snippetHasCode=!!codeNorm&&snippetNorm.includes(codeNorm);const titleMatchesChemical=chemicalNames.some(name=>titleNorm===name||titleNorm.startsWith(name+" ")||name.startsWith(titleNorm+" "));const score=titleHasCode?300:snippetHasCode&&titleMatchesChemical?220:snippetHasCode?0:-i;return {title,score}}).filter(item=>item.score>=200).sort((a,b)=>b.score-a.score);if(ranked.length)return {title:ranked[0].title,url:"https://en.wikipedia.org/wiki/"+encodeURIComponent(ranked[0].title.replace(/ /g,"_"))}}catch(e){continue}}return null}
async function findWikipediaArticle(x){const mapped=wikipediaArticleFromUrl(x&&x.wikiUrl);if(mapped)return mapped;const byCode=await searchWikipediaByCode(x);if(byCode)return byCode;const terms=wikipediaSearchNames({...x,wikiUrl:""});for(const term of terms){for(const query of ['"'+term+'"',term]){try{const url="https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch="+encodeURIComponent(query)+"&srnamespace=0&srlimit=8&format=json&origin=*";const data=await wikiFetchJson(url);const hits=data&&data.query&&data.query.search||[];const q=wikiNormaliseName(term),qWords=q.split(" ").filter(w=>w.length>2);const ranked=hits.map((h,i)=>{const t=wikiNormaliseName(h.title),words=t.split(" ");const overlap=qWords.filter(w=>words.includes(w)).length;const score=(t===q?120:0)+(t.includes(q)?55:0)+(qWords.length&&overlap===qWords.length?35:0)+(overlap*6)-i;return {title:h.title,score}}).filter(h=>h.score>=24).sort((a,b)=>b.score-a.score);if(ranked.length)return {title:ranked[0].title,url:"https://en.wikipedia.org/wiki/"+encodeURIComponent(ranked[0].title.replace(/ /g,"_"))}}catch(e){continue}}}return null}
function wikipediaSectionPreference(sections){const usable=sections.filter(s=>s&&s.index!==undefined);const preferred=usable.filter(s=>/food preservative|food preservation|preservative|food uses|uses|applications?/i.test(s.line||s.anchor||""));preferred.sort((a,b)=>{const score=s=>/food preservative|food preservation/i.test(s.line||s.anchor||"")?0:/^uses$/i.test(s.line||"")?1:/application|uses/i.test(s.line||s.anchor||"")?2:4;return score(a)-score(b)||(Number(a.level)||0)-(Number(b.level)||0)});return preferred[0]||null}
function wikipediaExcerptFromHtml(html){try{const doc=new DOMParser().parseFromString(String(html||""),"text/html");doc.querySelectorAll("sup,table,.mw-editsection,.navbox,.metadata,.reference,.hatnote,style,script,figure").forEach(n=>n.remove());const paragraphs=[...doc.querySelectorAll("p")].map(p=>p.textContent.replace(/\s+/g," ").trim()).filter(t=>t.length>35);return paragraphs[0]||""}catch(e){return ""}}
function setWikipediaPreview(title,section,excerpt,url){const panel=document.getElementById("wikiPanel"),box=document.getElementById("wikiPreview"),heading=document.getElementById("wikiSectionTitle"),articleHeading=document.getElementById("wikiArticleTitle"),link=document.getElementById("wikiLink");if(!panel||!box)return;wikipediaArticleUrl=url||"";wikipediaPageTitle=title||"";wikipediaSectionTitle=section||"Uses";if(!excerpt){panel.classList.add("hidden");return}heading.textContent=section||"Uses";if(articleHeading)articleHeading.textContent=title||"Wikipedia article";box.textContent=excerpt;link.textContent="Read full article on Wikipedia ↗";panel.classList.remove("hidden")}
