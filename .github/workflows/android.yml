name: Build FOSCH Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate embedded JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess
          import tempfile

          source = pathlib.Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>(.*?)</script>", source, flags=re.I | re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript blocks found")
          for index, script in enumerate(scripts, start=1):
              with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8", delete=False) as handle:
                  handle.write(script)
                  filename = handle.name
              subprocess.run(["node", "--check", filename], check=True)
              print(f"JavaScript block {index}/{len(scripts)} passed node --check")
          subprocess.run(["node", "--check", "app/src/main/assets/supabase.js"], check=True)
          print("Supabase JavaScript module passed node --check")
          subprocess.run(["node", "--check", "app/src/main/assets/admin.js"], check=True)
          print("Admin JavaScript module passed node --check")
          PY

      - name: Package source archive
        run: git archive --format=zip --prefix=FOSCH-v0.10.51/ HEAD > FOSCH-source-v0.10.51.zip

      - name: Upload source archive
        uses: actions/upload-artifact@v7
        with:
          name: FOSCH-source-v0.10.51
          path: FOSCH-source-v0.10.51.zip
          if-no-files-found: error
          retention-days: 90

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Check whether stable signing is configured
        id: signing_check
        env:
          FSC_KEYSTORE_BASE64: ${{ secrets.FSC_KEYSTORE_BASE64 }}
          FSC_KEYSTORE_PASSWORD: ${{ secrets.FSC_KEYSTORE_PASSWORD }}
          FSC_KEY_ALIAS: ${{ secrets.FSC_KEY_ALIAS }}
          FSC_KEY_PASSWORD: ${{ secrets.FSC_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$FSC_KEYSTORE_BASE64" && -n "$FSC_KEYSTORE_PASSWORD" && -n "$FSC_KEY_ALIAS" && -n "$FSC_KEY_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "$FSC_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fosch-release.jks"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build stable signed APK
        if: steps.signing_check.outputs.configured == 'true'
        env:
          FSC_KEYSTORE_PASSWORD: ${{ secrets.FSC_KEYSTORE_PASSWORD }}
          FSC_KEY_ALIAS: ${{ secrets.FSC_KEY_ALIAS }}
          FSC_KEY_PASSWORD: ${{ secrets.FSC_KEY_PASSWORD }}
        run: >-
          gradle assembleRelease
          -PFSC_KEYSTORE_PATH="$RUNNER_TEMP/fosch-release.jks"
          -PFSC_KEYSTORE_PASSWORD="$FSC_KEYSTORE_PASSWORD"
          -PFSC_KEY_ALIAS="$FSC_KEY_ALIAS"
          -PFSC_KEY_PASSWORD="$FSC_KEY_PASSWORD"

      - name: Build debug APK (fallback when stable signing secrets are not configured)
        if: steps.signing_check.outputs.configured != 'true'
        run: gradle assembleDebug

      - name: Upload stable signed APK
        if: steps.signing_check.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: FOSCH-stable-signed-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload debug APK
        if: steps.signing_check.outputs.configured != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: FOSCH-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
