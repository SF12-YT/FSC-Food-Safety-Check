name: Remove retired FOSCH media migration function

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "supabase/functions/fosch-media-migration/**"
      - ".github/workflows/deploy-media-migration.yml"

permissions:
  contents: read

jobs:
  remove-retired-function:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Delete retired migration Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions delete fosch-media-migration --project-ref mqgvagftvuybietazbdc --yes
