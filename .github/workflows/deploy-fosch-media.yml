name: Deploy FOSCH R2 media function

on:
  push:
    branches: ["main"]
    paths:
      - "supabase/functions/fosch-media/**"
      - "supabase/functions/fosch-media-migration/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-fosch-media.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fosch-r2-media-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: mqgvagftvuybietazbdc
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN CLOUDFLARE_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME R2_PUBLIC_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret for $name"
              exit 1
            fi
          done

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Edge Function TypeScript
        run: |
          deno check supabase/functions/fosch-media/index.ts
          deno check supabase/functions/fosch-media-migration/index.ts

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Configure Cloudflare R2 secrets in Supabase
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          secrets_file="$RUNNER_TEMP/fosch-r2-secrets.env"
          {
            printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$CLOUDFLARE_ACCOUNT_ID"
            printf 'R2_ACCESS_KEY_ID=%s\n' "$R2_ACCESS_KEY_ID"
            printf 'R2_SECRET_ACCESS_KEY=%s\n' "$R2_SECRET_ACCESS_KEY"
            printf 'R2_BUCKET_NAME=%s\n' "$R2_BUCKET_NAME"
            printf 'R2_PUBLIC_URL=%s\n' "$R2_PUBLIC_URL"
          } > "$secrets_file"
          supabase secrets set --env-file "$secrets_file" --project-ref "$SUPABASE_PROJECT_REF" --yes
          rm -f "$secrets_file"

      - name: Deploy FOSCH media Edge Function
        run: |
          supabase functions deploy fosch-media --project-ref "$SUPABASE_PROJECT_REF" --yes
          supabase functions deploy fosch-media-migration --project-ref "$SUPABASE_PROJECT_REF" --yes
